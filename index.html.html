<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeatherWhether</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-deep:#141b32;
    --sky-mid:#2b3a67;
    --sky-day:#3c5a99;
    --paper:#f2efe4;
    --gold:#f4a93b;
    --coral:#ff7a66;
    --ink:#1c2541;
    --mist:#b9c0de;
    --line: rgba(185,192,222,0.25);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    font-family:'Inter', sans-serif;
    color:var(--paper);
    background: radial-gradient(circle at 70% 8%, var(--sky-mid) 0%, var(--sky-deep) 55%, #0c1024 100%);
    transition: background 1s ease;
  }
  body.day{
    background: radial-gradient(circle at 75% 10%, var(--sky-day) 0%, var(--sky-mid) 55%, var(--sky-deep) 100%);
  }

  .wordmark{
    text-align:center;
    margin-bottom:22px;
  }
  .wordmark span{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:1.7rem;
    letter-spacing:0.01em;
  }
  .wordmark span.weather{ color:var(--gold); font-style:normal; font-weight:600;}
  .wordmark small{
    display:block;
    margin-top:4px;
    font-size:0.72rem;
    color:var(--mist);
    letter-spacing:0.03em;
  }

  .postcard{
    width:100%;
    max-width:400px;
    background:var(--paper);
    color:var(--ink);
    border-radius:6px;
    padding:28px 26px 22px;
    position:relative;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55);
  }
  .postcard::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid rgba(28,37,65,0.15);
    border-radius:3px;
    pointer-events:none;
  }

  form.search{
    display:flex;
    gap:10px;
    align-items:flex-end;
    border-bottom:1px solid rgba(28,37,65,0.25);
    padding-bottom:10px;
    margin-bottom:22px;
  }
  form.search input{
    flex:1;
    border:none;
    background:none;
    font-family:'Inter',sans-serif;
    font-size:0.95rem;
    color:var(--ink);
    outline:none;
    padding:4px 2px;
  }
  form.search input::placeholder{ color:rgba(28,37,65,0.4); }
  form.search button{
    border:none;
    background:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.85rem;
    color:var(--ink);
    cursor:pointer;
    padding:4px 2px;
    border-bottom:2px solid var(--gold);
  }
  form.search button:hover{ color:var(--coral); }
  .locate-link{
    text-align:right;
    margin:-14px 0 20px;
  }
  .locate-link button{
    border:none;background:none;padding:0;
    font-family:'Inter',sans-serif;
    font-size:0.75rem;
    color:rgba(28,37,65,0.55);
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .locate-link button:hover{ color:var(--ink); }

  .stage{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:18px;
    min-height:96px;
  }
  .stage svg{ width:88px; height:88px; flex-shrink:0; }

  .reading .temp{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:3.4rem;
    line-height:1;
  }
  .reading .place{
    font-weight:600;
    font-size:0.95rem;
    margin-top:2px;
  }
  .reading .condition{
    font-size:0.85rem;
    color:rgba(28,37,65,0.65);
    margin-top:1px;
  }

  .unit-toggle{
    display:inline-flex;
    gap:6px;
    font-size:0.78rem;
    margin-top:8px;
  }
  .unit-toggle button{
    border:none;background:none;cursor:pointer;
    font-family:'Inter',sans-serif;
    color:rgba(28,37,65,0.45);
    padding:0;
  }
  .unit-toggle button.active{ color:var(--ink); font-weight:600; text-decoration:underline; text-underline-offset:3px;}

  .details{
    border-top:1px solid rgba(28,37,65,0.15);
    padding-top:14px;
    display:grid;
    grid-template-columns:1fr 1fr;
    row-gap:10px;
  }
  .details div{ font-size:0.82rem; }
  .details span.label{
    display:block;
    color:rgba(28,37,65,0.5);
    font-size:0.72rem;
    margin-bottom:1px;
  }

  .status{
    text-align:center;
    font-size:0.85rem;
    color:var(--mist);
    margin-top:18px;
    min-height:1.2em;
  }

  .footer-note{
    text-align:center;
    font-size:0.7rem;
    color:rgba(185,192,222,0.6);
    margin-top:16px;
  }
  .footer-note a{ color:var(--mist); }

  .brand-footer{
    text-align:center;
    margin-top:28px;
    padding-top:22px;
    border-top:1px solid rgba(185,192,222,0.15);
  }
  .brand-footer img{
    width:64px;
    height:64px;
    object-fit:contain;
    display:block;
    margin:0 auto 10px;
  }
  .brand-footer .rights{
    font-size:0.72rem;
    color:rgba(185,192,222,0.55);
    letter-spacing:0.02em;
  }

  @media (max-width:420px){
    .stage svg{ width:72px; height:72px; }
    .reading .temp{ font-size:2.8rem; }
  }
</style>
</head>
<body>

  <div>
    <div class="wordmark">
      <span>Weather<span class="weather">Whether</span></span>
      <small>a small, honest reading of the sky</small>
    </div>

    <div class="postcard">
      <form class="search" id="searchForm">
        <input type="text" id="cityInput" placeholder="Search a city…" autocomplete="off">
        <button type="submit">Search</button>
      </form>
      <div class="locate-link">
        <button type="button" id="locateBtn">use my location instead</button>
      </div>

      <div class="stage">
        <div id="icon"></div>
        <div class="reading">
          <div class="temp" id="temp">--°</div>
          <div class="place" id="place">Finding you…</div>
          <div class="condition" id="condition">—</div>
        </div>
      </div>

      <div class="unit-toggle">
        <button id="unitF" class="active">°F</button>
        <span>/</span>
        <button id="unitC">°C</button>
      </div>

      <div class="details" style="margin-top:16px;">
        <div><span class="label">Feels like</span><span id="feels">—</span></div>
        <div><span class="label">Humidity</span><span id="humidity">—</span></div>
        <div><span class="label">Wind</span><span id="wind">—</span></div>
        <div><span class="label">Updated</span><span id="updated">—</span></div>
      </div>
    </div>

    <div class="status" id="status"></div>
    <div class="footer-note">Live data from Open&#8209;Meteo · no key, no tracking</div>

    <div class="brand-footer">
      <img src="akwest-logo.jpg" alt="AkwEst logo">
      <div class="rights">AkwEst 2026 all rights reserved.</div>
    </div>
  </div>

<script>
  const state = { unit: 'F', lastData: null };

  const ICONS = {
    sun: `<svg viewBox="0 0 100 100" fill="none" stroke="#f4a93b" stroke-width="3" stroke-linecap="round"><circle cx="50" cy="50" r="18"/><line x1="50" y1="10" x2="50" y2="22"/><line x1="50" y1="78" x2="50" y2="90"/><line x1="10" y1="50" x2="22" y2="50"/><line x1="78" y1="50" x2="90" y2="50"/><line x1="21" y1="21" x2="30" y2="30"/><line x1="70" y1="70" x2="79" y2="79"/><line x1="79" y1="21" x2="70" y2="30"/><line x1="30" y1="70" x2="21" y2="79"/></svg>`,
    moon: `<svg viewBox="0 0 100 100" fill="none" stroke="#b9c0de" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M62 20a32 32 0 1 0 18 42 26 26 0 0 1-18-42z"/><circle cx="70" cy="30" r="1.5" fill="#b9c0de"/><circle cx="76" cy="42" r="1" fill="#b9c0de"/></svg>`,
    cloudSun: `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round"><circle cx="38" cy="34" r="14" stroke="#f4a93b" stroke-width="3"/><path d="M20 66a16 16 0 0 1 4-31 20 20 0 0 1 38-6 15 15 0 0 1-3 37z" stroke="#1c2541" stroke-width="3" fill="none"/></svg>`,
    cloudMoon: `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round"><path d="M56 18a13 13 0 1 0 7 17 10 10 0 0 1-7-17z" stroke="#b9c0de" stroke-width="3"/><path d="M20 66a16 16 0 0 1 4-31 20 20 0 0 1 38-6 15 15 0 0 1-3 37z" stroke="#1c2541" stroke-width="3" fill="none"/></svg>`,
    cloud: `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round"><path d="M18 68a18 18 0 0 1 4-35 22 22 0 0 1 42-7 17 17 0 0 1-3 42z" stroke="#1c2541" stroke-width="3" fill="none"/></svg>`,
    fog: `<svg viewBox="0 0 100 100" fill="none" stroke="#8891b3" stroke-width="3" stroke-linecap="round"><path d="M22 40a16 16 0 0 1 4-31 20 20 0 0 1 38-4" fill="none"/><line x1="14" y1="58" x2="86" y2="58"/><line x1="22" y1="70" x2="78" y2="70"/><line x1="30" y1="82" x2="70" y2="82"/></svg>`,
    rain: `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round"><path d="M18 52a16 16 0 0 1 4-31 20 20 0 0 1 38-5 15 15 0 0 1-3 36z" stroke="#1c2541" stroke-width="3" fill="none"/><line x1="32" y1="70" x2="27" y2="86" stroke="#3c5a99" stroke-width="3"/><line x1="50" y1="70" x2="45" y2="86" stroke="#3c5a99" stroke-width="3"/><line x1="68" y1="70" x2="63" y2="86" stroke="#3c5a99" stroke-width="3"/></svg>`,
    snow: `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round"><path d="M18 52a16 16 0 0 1 4-31 20 20 0 0 1 38-5 15 15 0 0 1-3 36z" stroke="#1c2541" stroke-width="3" fill="none"/><g stroke="#8891b3" stroke-width="2.5"><line x1="32" y1="70" x2="32" y2="86"/><line x1="26" y1="78" x2="38" y2="78"/><line x1="66" y1="70" x2="66" y2="86"/><line x1="60" y1="78" x2="72" y2="78"/><circle cx="49" cy="80" r="2" fill="#8891b3" stroke="none"/></g></svg>`,
    storm: `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round"><path d="M18 50a16 16 0 0 1 4-31 20 20 0 0 1 38-5 15 15 0 0 1-3 36z" stroke="#1c2541" stroke-width="3" fill="none"/><path d="M52 66 L40 84 L52 84 L44 96" stroke="#ff7a66" stroke-width="3.5" fill="none"/></svg>`
  };

  function weatherInfo(code, isDay){
    const day = isDay === 1;
    if(code === 0) return {label:'Clear sky', icon: day?ICONS.sun:ICONS.moon};
    if(code === 1) return {label:'Mostly clear', icon: day?ICONS.cloudSun:ICONS.cloudMoon};
    if(code === 2) return {label:'Partly cloudy', icon: day?ICONS.cloudSun:ICONS.cloudMoon};
    if(code === 3) return {label:'Overcast', icon: ICONS.cloud};
    if([45,48].includes(code)) return {label:'Foggy', icon: ICONS.fog};
    if([51,53,55,56,57].includes(code)) return {label:'Drizzling', icon: ICONS.rain};
    if([61,63,65,66,67,80,81,82].includes(code)) return {label:'Raining', icon: ICONS.rain};
    if([71,73,75,77,85,86].includes(code)) return {label:'Snowing', icon: ICONS.snow};
    if([95,96,99].includes(code)) return {label:'Thunderstorms', icon: ICONS.storm};
    return {label:'Unsettled', icon: ICONS.cloud};
  }

  function setStatus(msg){ document.getElementById('status').textContent = msg; }

  function cToF(c){ return c*9/5+32; }

  function render(){
    const d = state.lastData;
    if(!d) return;
    const isF = state.unit === 'F';
    const t = isF ? cToF(d.temp) : d.temp;
    const feels = isF ? cToF(d.feels) : d.feels;
    document.getElementById('temp').textContent = Math.round(t) + '°';
    document.getElementById('feels').textContent = Math.round(feels) + '°' + state.unit;
    document.getElementById('humidity').textContent = d.humidity + '%';
    document.getElementById('wind').textContent = Math.round(d.wind) + (isF ? ' mph' : ' km/h');
    document.getElementById('condition').textContent = d.label;
    document.getElementById('place').textContent = d.place;
    document.getElementById('icon').innerHTML = d.icon;
    document.getElementById('updated').textContent = d.updated;
    document.body.classList.toggle('day', d.isDay === 1);
  }

  async function fetchWeather(lat, lon, place){
    setStatus('Reading the sky…');
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code,is_day&wind_speed_unit=mph&timezone=auto`;
      const res = await fetch(url);
      if(!res.ok) throw new Error('forecast request failed');
      const data = await res.json();
      const c = data.current;
      const info = weatherInfo(c.weather_code, c.is_day);
      state.lastData = {
        temp: c.temperature_2m,
        feels: c.apparent_temperature,
        humidity: c.relative_humidity_2m,
        wind: c.wind_speed_10m,
        label: info.label,
        icon: info.icon,
        isDay: c.is_day,
        place: place,
        updated: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
      };
      render();
      setStatus('');
    }catch(err){
      setStatus("Couldn't reach the sky right now — try again in a moment.");
    }
  }

  async function geocodeCity(name){
    setStatus('Looking that up…');
    try{
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=en&format=json`;
      const res = await fetch(url);
      const data = await res.json();
      if(!data.results || !data.results.length){
        setStatus('No place found by that name.');
        return;
      }
      const r = data.results[0];
      const place = [r.name, r.admin1, r.country].filter(Boolean).slice(0,2).join(', ');
      fetchWeather(r.latitude, r.longitude, place);
    }catch(err){
      setStatus("Couldn't look that up right now.");
    }
  }

  async function reverseGeocode(lat, lon){
    try{
      const url = `https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&language=en&format=json`;
      const res = await fetch(url);
      const data = await res.json();
      if(data.results && data.results.length){
        const r = data.results[0];
        return [r.name, r.admin1].filter(Boolean).slice(0,2).join(', ');
      }
    }catch(err){ /* fall through */ }
    return 'Your location';
  }

  function useLocation(){
    if(!navigator.geolocation){
      setStatus('Location isn’t available — try searching a city instead.');
      return;
    }
    setStatus('Finding you…');
    navigator.geolocation.getCurrentPosition(async pos => {
      const { latitude, longitude } = pos.coords;
      const place = await reverseGeocode(latitude, longitude);
      fetchWeather(latitude, longitude, place);
    }, () => {
      setStatus('Couldn’t get your location — try searching a city instead.');
    }, { timeout: 8000 });
  }

  document.getElementById('searchForm').addEventListener('submit', e => {
    e.preventDefault();
    const val = document.getElementById('cityInput').value.trim();
    if(val) geocodeCity(val);
  });
  document.getElementById('locateBtn').addEventListener('click', useLocation);
  document.getElementById('unitF').addEventListener('click', () => { state.unit='F'; document.getElementById('unitF').classList.add('active'); document.getElementById('unitC').classList.remove('active'); render(); });
  document.getElementById('unitC').addEventListener('click', () => { state.unit='C'; document.getElementById('unitC').classList.add('active'); document.getElementById('unitF').classList.remove('active'); render(); });

  useLocation();
</script>
</body>
</html>
